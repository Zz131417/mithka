# Build every platform on GitHub Actions workers.
#
# This is a stripped-down sibling of release.yml: it COMPILES each platform and
# uploads the unsigned artifact, but does NOT sign, notarize, or distribute.
# Push to `main` or run manually from the Actions tab (workflow_dispatch).
#
# Secrets you MUST set before a real build:
#   TELEGRAM_API_ID   - your my.telegram.org app id   (build compiles with a
#   TELEGRAM_API_HASH - your my.telegram.org app hash   placeholder if missing,
#                                                            so the binary just
#                                                            won't log in)
#
# iOS note: a device IPA needs Apple signing certs. This workflow builds the
# iOS *simulator* binary (no signing required) so the worker still exercises the
# full iOS compile path. To ship a real IPA, add the signing secrets and switch
# the ios job to `flutter build ipa` with an export-options plist.

name: Build all platforms

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  # ----------------------------------------------------------------- Android
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: android-arm64
          - abi: armeabi-v7a
            target: android-arm
          - abi: x86_64
            target: android-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Disable Flutter split-ABI versionCode offsets
        run: |
          constants="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterPluginConstants.kt"
          python3 - "$constants" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          for old, new in {
              "ARCH_ARM32 to 1": "ARCH_ARM32 to 0",
              "ARCH_ARM64 to 2": "ARCH_ARM64 to 0",
              "ARCH_X86_64 to 4": "ARCH_X86_64 to 0",
          }.items():
              if old not in text:
                  raise SystemExit(f"Could not find {old!r} in {path}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install Android NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null 2>&1 || \
          yes | sdkmanager "ndk;28.2.13676358" >/dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install pinned tdjson (${{ matrix.abi }})
        run: scripts/build-tdjson-android.sh "${{ matrix.abi }}"

      - name: Flutter dependencies
        run: flutter pub get

      - name: Write secrets.dart (placeholder if unset)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          mkdir -p lib/config
          cat > lib/config/secrets.dart <<EOF
          class Secrets {
            static const int apiId = ${TELEGRAM_API_ID:-0};
            static const String apiHash = '${TELEGRAM_API_HASH}';
            static bool get isConfigured => apiId != 0 && apiHash.isNotEmpty;
          }
          EOF

      - name: Set up public signing keystore
        # Public, non-private signing key. Credentials (android/android/android)
        # are intentionally public so the APK is reproducible without a private
        # release key. The Gradle release signingConfig in android/app/build.gradle.kts
        # picks this up via android/key.properties (which it already supports).
        # To pin ONE consistent signature across builds, download the
        # 'android-public-keystore' artifact once and commit
        # android/public.keystore.jks to the repo; the job will then reuse it.
        run: |
          KS=android/app/public.keystore.jks
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v \
              -keystore "$KS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias android \
              -dname "CN=Mithka Public, O=Mithka Public, C=US" \
              -storepass android -keypass android
          fi
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=android
          storeFile=public.keystore.jks
          EOF

      - name: Build ${{ matrix.abi }} APK (signed with public key)
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform ${{ matrix.target }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk
          if-no-files-found: error
      - name: Upload public keystore
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-public-keystore
          path: android/public.keystore.jks
          if-no-files-found: ignore

  # ----------------------------------------------------------------- Desktop
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            label: Linux x64
            os: ubuntu-24.04
            arch: x64
            library: libtdjson.so
            flutter_source: archive
          - platform: linux
            label: Linux arm64
            os: ubuntu-24.04-arm
            arch: arm64
            library: libtdjson.so
            flutter_source: git
          - platform: macos
            label: macOS universal
            os: macos-15
            arch: universal
            library: libtdjson.dylib
            flutter_source: archive
          - platform: windows
            label: Windows x64
            os: windows-2022
            arch: x64
            library: tdjson.dll
            flutter_source: archive
          - platform: windows
            label: Windows arm64
            os: windows-11-arm
            arch: arm64
            library: tdjson.dll
            flutter_source: git
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        if: matrix.flutter_source == 'archive'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter on an arm64 host
        if: matrix.flutter_source == 'git'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            flutter_home='/c/flutter'; path_entry='C:\flutter\bin'
          else
            flutter_home="$HOME/flutter"; path_entry="$flutter_home/bin"
          fi
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            --config advice.detachedHead=false \
            https://github.com/flutter/flutter.git "$flutter_home"
          "$flutter_home/bin/flutter" --version
          echo "$path_entry" >> "$GITHUB_PATH"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libavcodec-dev libavformat-dev \
            libavutil-dev libcurl4-openssl-dev libgtk-3-dev libjpeg-dev \
            liblzma-dev libkeybinder-3.0-dev libsecret-1-dev libswscale-dev \
            libpulse0 libgirepository1.0-dev librsvg2-dev patchelf \
            desktop-file-utils ninja-build pkg-config xvfb xdotool

      - name: Install pinned tdjson
        shell: bash
        run: |
          scripts/build-tdjson-desktop.sh \
            "${{ matrix.platform }}" "native-libs/${{ matrix.library }}" "${{ matrix.arch }}"

      - name: Enable Swift Package Manager (macOS)
        if: matrix.platform == 'macos'
        run: flutter config --enable-swift-package-manager

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Write secrets.dart (placeholder if unset)
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          mkdir -p lib/config
          cat > lib/config/secrets.dart <<EOF
          class Secrets {
            static const int apiId = ${TELEGRAM_API_ID:-0};
            static const String apiHash = '${TELEGRAM_API_HASH}';
            static bool get isConfigured => apiId != 0 && apiHash.isNotEmpty;
          }
          EOF

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release --target-platform="linux-${{ matrix.arch }}"
          bundle="build/linux/${{ matrix.arch }}/release/bundle"
          install -m 0755 native-libs/libtdjson.so "$bundle/lib/libtdjson.so"
          tar -C "$bundle" -czf "mithka-linux-${{ matrix.arch }}.tar.gz" .

      - name: Build macOS
        if: matrix.platform == 'macos'
        env:
          # Flutter 3.44 dropped the --no-codesign flag; build unsigned via
          # xcodebuild settings instead (no Apple cert available on the worker).
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: |
          flutter build macos --release
          cp native-libs/libtdjson.dylib build/macos/Build/Products/Release/Mithka.app/Contents/Frameworks/ 2>/dev/null || \
          cp native-libs/libtdjson.dylib build/macos/Build/Products/Release/Mithka.app/Contents/MacOS/ 2>/dev/null || true
          tar -C build/macos/Build/Products/Release -czf mithka-macos.tar.gz Mithka.app

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "arm64") {
            python3 scripts/drop-windows-plugin.py firebase_core `
              --reason 'Firebase publishes no Windows ARM64 binaries'
            flutter pub get
          }
          flutter build windows --release --no-pub
          $arch = "${{ matrix.arch }}"
          Copy-Item native-libs/tdjson.dll "build/windows/$arch/runner/Release/"
          Compress-Archive -Path "build/windows/$arch/runner/Release/*" `
            -Destination "mithka-windows-$arch.zip" 

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            mithka-linux-*.tar.gz
            mithka-macos.tar.gz
            mithka-windows-*.zip
          if-no-files-found: ignore

  # ----------------------------------------------------------------- iOS
  # Builds the simulator binary (no Apple signing needed) so the worker still
  # runs the full iOS compile. For a real device IPA, add signing secrets and
  # replace the build step with `flutter build ipa`.
  ios:
    name: iOS (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install pinned tdjson (iOS)
        run: scripts/build-tdjson-ios.sh

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Write secrets.dart (placeholder if unset)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          mkdir -p lib/config
          cat > lib/config/secrets.dart <<EOF
          class Secrets {
            static const int apiId = ${TELEGRAM_API_ID:-0};
            static const String apiHash = '${TELEGRAM_API_HASH}';
            static bool get isConfigured => apiId != 0 && apiHash.isNotEmpty;
          }
          EOF

      - name: Build iOS simulator
        run: flutter build ios --simulator --profile

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
